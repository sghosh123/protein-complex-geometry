[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-complex-geometry"
version = "0.1.0a1"
description = "Reproducible rigid-body alignment, coordinate transforms, and inter-structure clash checks for protein complexes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
authors = [{name = "Research software project"}]
keywords = ["structural-biology", "protein-complex", "PDB", "alignment", "molecular-modeling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pcg = "protein_complex_geometry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
